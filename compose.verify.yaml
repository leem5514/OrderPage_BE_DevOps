# 기존 compose.yaml과 함께 -p orderpage-readiness로 실행한다.
# 원래 개발 DB와 포트를 재사용하지 않는 로컬 검증 전용 override다.
services:
  mariadb:
    ports: !reset []
  redis:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  app:
    ports: !override
      - '127.0.0.1:18080:8080'
    environment:
      # 실제 계정 자격증명을 컨테이너로 넘기지 않는다. S3 통신은 이 smoke의 대상이 아니다.
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      AWS_EC2_METADATA_DISABLED: 'true'
      BOOTSTRAP_ADMIN_ENABLED: 'false'
      BOOTSTRAP_ADMIN_PASSWORD: ''
      ORDER_STOCK_PROCESSING_MODE: 'REDIS_ASYNC'
