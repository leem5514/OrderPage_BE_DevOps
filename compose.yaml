services:
  mariadb:
    image: 'mariadb:11'
    # MariaDB 11.8부터 innodb_snapshot_isolation이 기본 ON이라, 동시 트랜잭션이 같은 행에
    # 락을 걸 때(PESSIMISTIC_WRITE) 예전처럼 대기시키는 대신 "Record has changed since last
    # read"(1020) 에러를 던진다. 부하테스트 때 정상적인 동시 요청까지 에러로 처리해버려서 끔.
    command: --innodb-snapshot-isolation=0
    environment:
      - 'MARIADB_DATABASE=ordersystem'
      - 'MARIADB_ROOT_PASSWORD=1234'
    ports:
      - '3307:3306' # 호스트에 이미 mysqld(3306)가 떠 있는 경우가 많아 호스트 포트만 3307로 바꿈. 컨테이너 간 통신은 mariadb:3306 그대로 사용
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: 'rabbitmq:3-management-alpine'
    ports:
      - '5673:5672' # 호스트에 이미 다른 rabbitmq(5672)가 떠 있어 호스트 포트만 5673으로 바꿈
      - '15673:15672' # 관리 콘솔 (guest/guest), http://localhost:15673
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '8080:8080'
    environment:
      DB_URL: 'jdbc:mariadb://mariadb:3306/ordersystem'
      DB_USERNAME: 'root'
      DB_PASSWORD: '1234'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      RABBITMQ_HOST: 'rabbitmq'
      RABBITMQ_PORT: '5672'
      RABBITMQ_USERNAME: 'guest'
      RABBITMQ_PASSWORD: 'guest'
      RABBITMQ_VHOST: '/'
      JWT_SECRET_KEY: 'local_dev_secret_key_change_me'
      JWT_SECRET_KEY_RT: 'local_dev_refresh_secret_change_me'
      # 실제 S3를 쓰려면 아래 3개만 진짜 값으로 채우면 코드 변경 없이 그대로 동작한다.
      AWS_ACCESS_KEY: '${AWS_ACCESS_KEY:-test}'
      AWS_SECRET_KEY: '${AWS_SECRET_KEY:-test}'
      AWS_REGION: '${AWS_REGION:-ap-northeast-2}'
      AWS_S3_BUCKET: '${AWS_S3_BUCKET:-order-system-bucket}'
      CORS_ALLOWED_ORIGINS: 'http://localhost:8081,http://localhost:8092'
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mariadb_data:
