server:
  port: 8080
  tomcat:
    # 기본값(threads.max=200, accept-count=100)은 500명이 동시에 요청을 쏘면 커넥터 단계에서부터
    # 거절/대기가 생겨서, 정작 보고 싶은 DB/Redis/RabbitMQ 병목보다 먼저 병목처럼 보일 수 있다.
    # 부하테스트 목표치(500)에 여유를 두고 맞춤.
    threads:
      max: ${TOMCAT_THREADS_MAX:500}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:500}
spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  # rabbitMQ 환경설정 (재고 감소 이벤트 비동기 처리용)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # 재고 반영 큐 컨슈머를 여러 개 띄워서 부하테스트 때 RDB 재고 반영이 뒤로 밀리는 걸 줄인다.
        # (StockDecreaseEventHandler.listen()이 findByIdForUpdate로 행 잠금을 걸도록 같이 바꿔서,
        #  여러 컨슈머가 동시에 돌아도 같은 상품끼리는 안전하게 직렬화되고 다른 상품은 병렬 처리된다.)
        concurrency: ${RABBITMQ_LISTENER_CONCURRENCY:3}
        max-concurrency: ${RABBITMQ_LISTENER_MAX_CONCURRENCY:10}
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL:jdbc:mariadb://localhost:3306/ordersystem}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      # 스프링부트 기본값(10)은 동시 주문이 몰리는 상황을 못 버텨서 넉넉하게 올려둠.
      # 실제 운영 DB 스펙(max_connections)에 맞춰 환경변수로 조정할 것.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      pool-name: OrderSystemHikariPool
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    root: info

jwt:
  expiration: 30
  secretKey: ${JWT_SECRET_KEY:local_dev_secret_key_change_me}
  expirationRt: 14400
  secretKeyRt: ${JWT_SECRET_KEY_RT:local_dev_refresh_secret_change_me}

# 로컬/도커 개발 시 아래 기본값 그대로 사용 가능. 실제 배포 시에는
# AWS_ACCESS_KEY / AWS_SECRET_KEY / AWS_S3_BUCKET 환경변수만 채워주면 코드 변경 없이 동작한다.
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:test}
      secret-key: ${AWS_SECRET_KEY:test}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:order-system-bucket}

# 콤마로 구분된 허용 origin 목록 (프론트 로컬 개발 서버 포함)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8092,https://www.dding.shop}
