spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ordersystem_test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

jwt:
  expiration: 30
  secretKey: test_only_access_key_not_for_deployment_00000000
  expirationRt: 14400
  secretKeyRt: test_only_refresh_key_not_for_deployment_11111111

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket

cors:
  allowed-origins: http://localhost:8081

order:
  # 기본 테스트는 외부 Redis/RabbitMQ가 필요 없는 Before 경로로 실행한다.
  stock-processing-mode: RDB_SYNC
