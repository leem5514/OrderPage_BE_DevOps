spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ordersystem_test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

jwt:
  expiration: 30
  secretKey: test_access_secret_key
  expirationRt: 14400
  secretKeyRt: test_refresh_secret_key

cloud:
  aws:
    credentials:
      access-key: test
      secret-key: test
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket

cors:
  allowed-origins: http://localhost:8081
